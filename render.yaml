services:
  - type: web
    name: la-ban-tuoi-teen
    env: node
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && npx prisma db push && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
